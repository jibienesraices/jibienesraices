<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JI Bienes Raíces | Administración</title>

    <link rel="stylesheet" href="admin-login.css">

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <!-- =================================================
                 MARCA
                 ================================================= -->

            <div class="login-brand">

                <h1>
                    <span>JI</span>
                    Bienes Raíces
                </h1>

                <div class="brand-line"></div>

                <p class="brand-slogan">
                    Fácil. Seguro. Rápido.
                </p>

            </div>


            <!-- =================================================
                 LOGIN
                 ================================================= -->

            <div class="login-content">

                <p class="login-label">
                    ACCESO PRIVADO
                </p>

                <h2>
                    Administración
                </h2>

                <p class="login-description">
                    Ingresa tu contraseña para acceder
                    al panel de administración.
                </p>


                <form id="login-form">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Introduce la contraseña"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Entrar
                    </button>

                </form>


                <p
                    id="message"
                    class="login-message"
                ></p>

            </div>


            <!-- =================================================
                 REGRESAR
                 ================================================= -->

            <a
                href="/"
                class="back-to-site"
            >
                ← Volver a JI Bienes Raíces
            </a>

        </section>

    </main>


    <script src="admin.js"></script>

</body>

</html>
