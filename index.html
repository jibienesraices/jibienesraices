<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J-I Bienes Raíces</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Encabezado principal -->
    <header class="main-header">

        <div class="brand">
            <h1>J-I Bienes Raíces</h1>

            <p class="slogan">
                <span>Fácil.</span>
                <span>Seguro.</span>
                <span>Rápido.</span>
            </p>

            <p class="slogan-subtitle">
                No te compliques, nosotros lo resolvemos.
            </p>
        </div>

    </header>


    <!-- Contenido principal -->
    <main>

        <section id="properties" class="properties-section">

            <div class="section-header">
                <h2>Propiedades disponibles</h2>

                <p>
                    Encuentra el lugar ideal para ti y tu familia.
                </p>
            </div>


            <!-- Las propiedades aparecerán aquí mediante JavaScript -->
            <div id="property-list">

                <!-- Las casas aparecerán aquí -->

            </div>

        </section>

    </main>


    <!-- Contacto para propietarios -->
    <div class="owner-contact">

        <button
            id="owner-contact-button"
            class="owner-contact-button"
            type="button"
        >
            🏠 ¿Quieres vender tu propiedad?
        </button>


        <div
            id="owner-contact-menu"
            class="owner-contact-menu"
        >

            <p class="owner-contact-title">
                ¿Quieres vender tu propiedad?
            </p>

            <p class="owner-contact-text">
                Nosotros nos encargamos del proceso.
                Fácil, seguro y rápido.
            </p>

            <button
                id="owner-whatsapp-button"
                class="owner-whatsapp-button"
                type="button"
            >
                💬 Contactar por WhatsApp
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
